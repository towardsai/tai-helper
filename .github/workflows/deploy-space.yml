name: Deploy to HF Space

# One-time recovery branch only. Never merge this replacement workflow.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair-thinkific-credential:
    if: github.ref == 'refs/heads/ops/thinkific-deploy-credential-repair'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install sealed-box encryption library
        run: python -m pip install PyNaCl==1.6.0
      - name: Seal existing HF credential for the Thinkific repository
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'INNERPY'
          import base64
          import json
          import os
          import urllib.request
          from pathlib import Path
          from nacl import encoding, public

          token = os.environ["HF_TOKEN"]
          request = urllib.request.Request(
              "https://huggingface.co/api/whoami-v2",
              headers={"Authorization": "Bearer " + token},
          )
          with urllib.request.urlopen(request, timeout=20) as response:
              account = json.load(response)
          print("Existing deployment token role:", account["auth"]["accessToken"]["role"])
          key = public.PublicKey(
              b"pP5WoiHcOcvKvDgqlX3zCIo6DO6lJfqC1043Z5KdFz8=",
              encoding.Base64Encoder(),
          )
          ciphertext = public.SealedBox(key).encrypt(token.encode())
          Path("thinkific-hf-secret.json").write_text(json.dumps({
              "key_id": "3380204578043523366",
              "encrypted_value": base64.b64encode(ciphertext).decode(),
          }))
          print("Created destination-encrypted payload; no plaintext credential exported.")
          INNERPY
      - uses: actions/upload-artifact@v4
        with:
          name: thinkific-hf-secret
          path: thinkific-hf-secret.json
          retention-days: 1
